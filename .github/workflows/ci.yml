name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: End-to-end mail tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/react-email/package-lock.json

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          # the pytest fixtures ship as a package; installing it is what
          # registers them, exactly as a user would do it
          pip install -e clients/python

      - name: Build and start tahidromos
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Wait for it to come up
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "ready after ${attempt} attempts"
              curl -s http://localhost:8080/health
              exit 0
            fi
            sleep 2
          done
          echo "tahidromos did not come up in time"
          docker compose logs --no-color
          exit 1

      - name: Smoke test — send a mail and confirm it arrived
        run: python examples/send_email.py

      - name: Smoke test — send, reply, and reply to the reply
        run: python examples/reply_conversation.py --turns 6

      - name: Check the React Email export is not stale
        working-directory: templates/react-email
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Run the test suite
        run: pytest

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tahidromos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
