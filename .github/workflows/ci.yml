name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: End-to-end mail tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/react-email/package-lock.json

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          # the pytest fixtures ship as a package; installing it is what
          # registers them, exactly as a user would do it
          pip install -e clients/python
          # the MCP tests import the server package; without it they skip
          pip install -e clients/mcp

      - name: Build and start tahidromos
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Wait for it to come up
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "ready after ${attempt} attempts"
              curl -s http://localhost:8080/health
              exit 0
            fi
            sleep 2
          done
          echo "tahidromos did not come up in time"
          docker compose logs --no-color
          exit 1

      - name: Smoke test — send a mail and confirm it arrived
        run: python examples/send_email.py

      - name: Smoke test — send, reply, and reply to the reply
        run: python examples/reply_conversation.py --turns 6

      - name: Check the React Email export is not stale
        working-directory: templates/react-email
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Run the test suite
        run: pytest

      - name: Run the JavaScript client tests
        run: node --test clients/node/test/*.test.js

      - name: Install a browser
        run: |
          pip install -r tests/e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Drive the real interface in a browser
        run: pytest tests/e2e

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tahidromos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify the published image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, so this is exactly the artifact the publish job produced —
      # not whatever `latest` happens to point at by the time this runs.
      - name: Run the image that was just published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/tahidromos@${{ needs.publish.outputs.digest }}
        run: |
          echo "Verifying $IMAGE"
          docker run -d --name published \
            -p 1025:25 -p 1587:587 -p 1143:143 -p 8080:8080 "$IMAGE"
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "ready after ${attempt} attempts"
              curl -s http://localhost:8080/health
              exit 0
            fi
            sleep 2
          done
          echo "the published image did not become healthy"
          docker logs published
          exit 1

      # The quick start in the README is a `docker run` and nothing else, so
      # these have to pass with no configuration of any kind.
      - name: It delivers mail
        run: python examples/send_email.py

      - name: It holds a threaded conversation
        run: python examples/reply_conversation.py --turns 6

      - name: Everything is present with zero configuration
        run: |
          python - <<'PY'
          import json, sys, urllib.request

          def get(path):
              with urllib.request.urlopen(f"http://localhost:8080{path}", timeout=30) as r:
                  return json.load(r)

          health = get("/health")
          templates = get("/templates")["templates"]
          scenarios = get("/scenarios")["scenarios"]
          spam = get("/spam")

          print(f"mailboxes  {health['mailboxes']}")
          print(f"templates  {len(templates)}")
          print(f"scenarios  {len(scenarios)}")
          print(f"spam       builtin={spam['builtin']['available']}")

          problems = []
          if health["status"] != "ok":
              problems.append("health is not ok")
          if health["mailboxes"] < 10:
              problems.append(f"only {health['mailboxes']} mailboxes were seeded")
          if len(templates) < 8:
              problems.append(f"only {len(templates)} templates")
          if len(scenarios) < 10:
              problems.append(f"only {len(scenarios)} scenarios")
          if not spam["builtin"]["available"]:
              problems.append("the spam scorer is missing")
          if problems:
              sys.exit("published image is incomplete: " + "; ".join(problems))
          print("\nthe published image is complete and needs no configuration")
          PY

      # The interface is part of the product, so the published image has to
      # serve a working one — not just answer /health.
      - name: Drive the published image's interface in a browser
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/tahidromos@${{ needs.publish.outputs.digest }}
        run: |
          docker rm -f published
          pip install -r tests/requirements.txt -r tests/e2e/requirements.txt
          playwright install --with-deps chromium
          TAHIDROMOS_IMAGE="$IMAGE" pytest tests/e2e

      - name: Show the logs if anything failed
        if: failure()
        run: docker logs published || docker logs tahidromos-e2e || true

      - name: Stop it
        if: always()
        run: docker rm -f published || true
