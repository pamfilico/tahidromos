<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>{{ subject }}</title><style>
  /* Clients that support <style> get comfortable small-screen padding.
     Everything still works without it — the layout is fluid either way. */
  @media only screen and (max-width:620px){
    .pad{padding-left:18px!important;padding-right:18px!important}
    .shell{border-radius:0!important;border-left:0!important;border-right:0!important}
    .code{font-size:26px!important;letter-spacing:0.2em!important}
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<span style="display:none!important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden;">{{ preheader }}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;">
  <tr><td align="center" class="pad" style="padding:32px 12px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="shell" style="max-width:600px;background:#ffffff;border-radius:12px;border:1px solid #e5e7eb;">
      <tr><td class="pad" style="padding:28px 32px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="font-size:15px;font-weight:600;color:#111827;"><img src="{{{ logo }}}" alt="" width="26" height="26" style="display:inline-block;vertical-align:middle;border-radius:50%;margin-right:9px;width:26px;height:26px">{{ product }}</td>
          <td align="right" style="font-size:12px;color:#6b7280;">{{ period }}</td>
        </tr></table>
      </td></tr>
      <tr><td class="pad" style="padding:22px 32px 4px;">
        <h1 style="margin:0 0 8px;font-size:24px;font-weight:600;color:#111827;letter-spacing:-0.02em;">{{ headline }}</h1>
        <p style="margin:0 0 8px;font-size:15px;line-height:1.6;color:#4b5563;">{{ intro }}</p>
      </td></tr>
      {{#each articles}}
      <tr><td class="pad" style="padding:16px 32px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #f3f4f6;">
          <tr><td style="padding:16px 0 0;">
            <p style="margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:#2563eb;font-weight:600;">{{ tag }}</p>
            <a href="{{ url }}" style="display:block;margin:0 0 6px;font-size:17px;font-weight:600;color:#111827;text-decoration:none;line-height:1.35;">{{ title }}</a>
            <p style="margin:0 0 6px;font-size:14px;line-height:1.6;color:#4b5563;">{{ excerpt }}</p>
            <a href="{{ url }}" style="font-size:13px;color:#2563eb;text-decoration:none;font-weight:600;">Read it →</a>
          </td></tr>
        </table>
      </td></tr>
      {{/each}}
      <tr><td class="pad" style="padding:26px 32px 30px;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
          You get this because you subscribed to {{ product }}.
          <a href="{{ unsubscribe_url }}" style="color:#6b7280;text-decoration:underline;">Unsubscribe</a> any time.
        </p>
      </td></tr>
    </table>
    <p style="margin:18px 0 0;font-size:12px;color:#9ca3af;">{{ company }}</p>
  </td></tr>
</table>
</body></html>
