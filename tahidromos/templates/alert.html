<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>{{ subject }}</title><style>
  /* Clients that support <style> get comfortable small-screen padding.
     Everything still works without it — the layout is fluid either way. */
  @media only screen and (max-width:620px){
    .pad{padding-left:18px!important;padding-right:18px!important}
    .shell{border-radius:0!important;border-left:0!important;border-right:0!important}
    .code{font-size:26px!important;letter-spacing:0.2em!important}
  }
</style>
</head>
<body style="margin:0;padding:0;background:#0b0d12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<span style="display:none!important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden;">{{ severity }}: {{ title }}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0b0d12;">
  <tr><td align="center" class="pad" style="padding:32px 12px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="shell" style="max-width:600px;background:#11141b;border-radius:12px;border:1px solid #262b36;">
      <tr><td class="pad" style="padding:26px 32px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="background:{{ severity_color }};border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:0.08em;color:#0b0d12;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;">{{ severity }}</td>
          <td style="padding-left:12px;font-size:12px;color:#8792a8;font-family:ui-monospace,Menlo,monospace;">{{ fired_at }}</td>
        </tr></table>
      </td></tr>
      <tr><td class="pad" style="padding:18px 32px 0;">
        <h1 style="margin:0 0 10px;font-size:22px;font-weight:600;color:#e8ecf4;letter-spacing:-0.02em;line-height:1.3;">{{ title }}</h1>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#8792a8;">{{ body }}</p>
      </td></tr>
      <tr><td style="padding:0 32px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#151924;border:1px solid #262b36;border-radius:10px;">
          {{#each facts}}
          <tr>
            <td class="pad" style="padding:11px 16px;font-size:12px;color:#5d6678;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid #1e2330;">{{ label }}</td>
            <td align="right" style="padding:11px 16px;font-size:12px;color:#e8ecf4;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid #1e2330;">{{ value }}</td>
          </tr>
          {{/each}}
        </table>
      </td></tr>
      <tr><td class="pad" style="padding:22px 32px 30px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="border-radius:8px;background:#6ea8fe;">
            <a href="{{ runbook_url }}" style="display:inline-block;padding:11px 20px;font-size:14px;font-weight:600;color:#08101f;text-decoration:none;border-radius:8px;">Open the runbook</a>
          </td>
          <td style="padding-left:12px;">
            <a href="{{ silence_url }}" style="display:inline-block;padding:11px 18px;font-size:14px;font-weight:600;color:#8792a8;text-decoration:none;border:1px solid #2a3040;border-radius:8px;">Silence 1h</a>
          </td>
        </tr></table>
      </td></tr>
    </table>
    <p style="margin:18px 0 0;font-size:12px;color:#5d6678;">{{ company }} monitoring</p>
  </td></tr>
</table>
</body></html>
