[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tahidromos-mcp"
version = "1.0.0"
description = "An MCP server giving AI agents a local, disposable email inbox"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Georgios Pamfilis", email = "gpamfilis@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "email", "agents", "testing", "sandbox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = ["mcp>=2.0", "httpx>=0.27", "pydantic>=2.0"]

[project.scripts]
tahidromos-mcp = "tahidromos_mcp.server:main"

[project.urls]
Homepage = "https://github.com/pamfilico/tahidromos"
Source = "https://github.com/pamfilico/tahidromos"

[tool.hatch.build.targets.wheel]
packages = ["src/tahidromos_mcp"]
