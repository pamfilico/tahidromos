[pytest]
testpaths = tests
# "." puts the repo root on sys.path so tests can import the server's own
# pure functions; bare `pytest` does not add the working directory the way
# `python -m pytest` does, and CI runs it bare.
pythonpath = . tests
addopts = -v --tb=short --strict-markers --durations=10
markers =
    slow: tests that wait on the auto-responder bots
